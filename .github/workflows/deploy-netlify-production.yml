name: deploy production frontend to Netlify

on:
  push:
    paths:
      - '.github/workflows/deploy-netlify-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/rollback-live-to-griot-baseline

      - name: Prepare rollback frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '6e0628de6ea465314d50fa8f7aca2eb40d9c9aa0' || true
          rm -rf deploy
          mkdir deploy
          rsync -a ./ deploy/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='dist' \
            --exclude='scripts' \
            --exclude='appsscript' \
            --exclude='.clasp.json*' \
            --exclude='.claude' \
            --exclude='.netlify-site-id'
          cat > deploy/src/core/config.js <<'EOF'
          export const config = {
            version: '2.0.0',
            api: {
              baseUrl: 'https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec',
              timeoutMs: 20000,
            },
            app: {
              name: 'Flow Tribe',
              memberEntry: 'index.html',
              adminEntry: 'admin.html',
              timezone: 'Africa/Lagos',
            },
            rules: {
              pinLength: 6,
              usernameMinLength: 3,
              usernameMaxLength: 20,
              bioMaxLength: 160,
            },
            debug: false,
          };
          export default config;
          EOF
          rm -f deploy/gallery.html

      - name: Deploy rollback to production
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@23.11.0 deploy \
            --prod \
            --dir deploy \
            --site '10422d5c-3f32-47bb-a258-1a8486e626c0' \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message 'Rollback to stable Griot baseline 6e0628d' \
            --json | tee netlify-deploy.json

      - name: Verify rollback assets
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://dainty-frangollo-1063b3.netlify.app'
          INDEX="$(curl -fsSL "$SITE/")"
          ASSIST="$(curl -fsSL "$SITE/src/features/showcase/member-assist.js")"
          GRIOT="$(curl -fsSL "$SITE/src/features/showcase/meta-ai.js")"
          printf '%s' "$ASSIST" | grep -Fq 'Show me round'
          printf '%s' "$GRIOT" | grep -Fq 'Griot'
          if printf '%s' "$INDEX" | grep -Fq 'styles/experience-repair.css'; then
            echo 'Rollback failed: regression repair stylesheet is still live'
            exit 31
          fi
          echo 'PRODUCTION ROLLBACK BASELINE VERIFIED'

      - name: Show deployment result
        shell: bash
        run: cat netlify-deploy.json
