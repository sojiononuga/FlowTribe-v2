name: deploy production frontend to Netlify

on:
  push:
    paths:
      - '.github/workflows/deploy-netlify-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare production frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir deploy
          rsync -a ./ deploy/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='dist' \
            --exclude='scripts' \
            --exclude='appsscript' \
            --exclude='.clasp.json*' \
            --exclude='.claude' \
            --exclude='.netlify-site-id'
          cat > deploy/src/core/config.js <<'EOF'
          export const config = {
            version: '2.0.0',
            api: {
              baseUrl: 'https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec',
              timeoutMs: 20000,
            },
            app: {
              name: 'Flow Tribe',
              memberEntry: 'index.html',
              adminEntry: 'admin.html',
              timezone: 'Africa/Lagos',
            },
            rules: {
              pinLength: 6,
              usernameMinLength: 3,
              usernameMaxLength: 20,
              bioMaxLength: 160,
            },
            debug: false,
          };
          export default config;
          EOF
          rm -f deploy/gallery.html

      - name: Check Netlify authentication
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'NETLIFY_AUTH_TOKEN is not configured'; exit 20; }

      - name: Resolve or create Netlify site
        id: site
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -s .netlify-site-id ]; then
            SITE_ID="$(tr -d '\r\n ' < .netlify-site-id)"
            SITE_JSON="$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$SITE_ID")"
          else
            SITE_JSON="$(curl -fsS -X POST \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{}' \
              'https://api.netlify.com/api/v1/sites')"
            SITE_ID="$(printf '%s' "$SITE_JSON" | jq -r '.id')"
            test -n "$SITE_ID" && test "$SITE_ID" != null
            printf '%s\n' "$SITE_ID" > .netlify-site-id
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .netlify-site-id
            git commit -m 'ops: record Flow Tribe Netlify site id'
            git push origin HEAD:main
          fi
          SITE_URL="$(printf '%s' "$SITE_JSON" | jq -r '.ssl_url // .url')"
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "Netlify site: $SITE_URL"

      - name: Deploy to Netlify production
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli@23.11.0 deploy \
            --prod \
            --dir deploy \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Flow Tribe v2 production $GITHUB_SHA" \
            --json | tee netlify-deploy.json

      - name: Show deployment result
        shell: bash
        run: |
          cat netlify-deploy.json
          echo "Production site: ${{ steps.site.outputs.site_url }}"

# retrigger after Netlify token provisioning
