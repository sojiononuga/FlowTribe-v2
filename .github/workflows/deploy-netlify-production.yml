name: deploy production frontend to Netlify

on:
  push:
    paths:
      - '.github/workflows/deploy-netlify-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir deploy
          rsync -a ./ deploy/ \
            --exclude='.git' --exclude='.github' --exclude='deploy' \
            --exclude='tests' --exclude='docs' --exclude='dist' \
            --exclude='scripts' --exclude='appsscript' --exclude='.clasp.json*' \
            --exclude='.claude' --exclude='.netlify-site-id'
          cat > deploy/src/core/config.js <<'EOF'
          export const config = {
            version: '2.0.0',
            api: {
              baseUrl: 'https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec',
              timeoutMs: 20000,
            },
            app: { name: 'Flow Tribe', memberEntry: 'index.html', adminEntry: 'admin.html', timezone: 'Africa/Lagos' },
            rules: { pinLength: 6, usernameMinLength: 3, usernameMaxLength: 20, bioMaxLength: 160 },
            debug: false,
          };
          export default config;
          EOF
          rm -f deploy/gallery.html

      - name: Deploy production
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@23.11.0 deploy \
            --prod \
            --dir deploy \
            --functions deploy/netlify/functions \
            --site '10422d5c-3f32-47bb-a258-1a8486e626c0' \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Griot tour voice repair 4f2fdceced940214db156cf385a2e2baedc3e1e0" \
            --json | tee netlify-deploy.json

      - name: Verify live Griot experience repair
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://dainty-frangollo-1063b3.netlify.app'
          INDEX="$(curl -fsSL "$SITE/")"
          ASSIST="$(curl -fsSL "$SITE/src/features/showcase/member-assist.js")"
          REPAIR="$(curl -fsSL "$SITE/styles/experience-repair.css")"
          CHAT="$(curl -fsSL "$SITE/netlify/functions/griot-chat.mjs" 2>/dev/null || true)"

          printf '%s' "$INDEX" | grep -Fq 'styles/experience-repair.css'
          printf '%s' "$ASSIST" | grep -Fq 'document.body.append(tour)'
          printf '%s' "$ASSIST" | grep -Fq '/.netlify/functions/griot-voice'
          printf '%s' "$REPAIR" | grep -Fq 'z-index: 10002'
          printf '%s' "$REPAIR" | grep -Fq 'max-height: 46dvh'

          VOICE="$(curl -sSL -H 'Content-Type: application/json' --data '{"text":"Griot"}' "$SITE/.netlify/functions/griot-voice")"
          FAST="$(curl -sSL -H 'Content-Type: application/json' --data '{"action":"griot.chat","payload":{"message":"hello"}}' "$SITE/.netlify/functions/griot-chat")"
          SPEECH_FALLBACK="$(curl -sSL -H 'Content-Type: application/json' --data '{"action":"griot.speak","payload":{"text":"Griot"}}' "$SITE/.netlify/functions/griot")"

          printf '%s' "$VOICE" | grep -q 'SESSION_EXPIRED'
          printf '%s' "$FAST" | grep -q 'SESSION_EXPIRED'
          printf '%s' "$SPEECH_FALLBACK" | grep -q 'SESSION_EXPIRED'
          if printf '%s' "$VOICE$FAST$SPEECH_FALLBACK" | grep -q 'NOT_FOUND'; then exit 31; fi
          echo 'LIVE GRIOT TOUR VOICE REPAIR PASSED'

      - name: Show deployment result
        shell: bash
        run: cat netlify-deploy.json
