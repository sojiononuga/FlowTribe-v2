name: import stable Flow source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch inherited stable source
        run: git clone --depth=1 https://github.com/IyanuoluwaIlesanmi/FlowTribe-v2.git /tmp/upstream

      - name: Import source cleanly
        run: |
          rsync -a --delete --exclude='.git' /tmp/upstream/ ./
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-universal.yml
          git config user.name "Flow Tribe CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: import stable inherited Flow source"
          git push origin HEAD:main
