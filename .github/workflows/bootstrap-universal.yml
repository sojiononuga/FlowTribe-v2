name: bootstrap universal Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
      - name: Bootstrap paused while transfer payload is repaired
        run: echo "Bootstrap paused"
