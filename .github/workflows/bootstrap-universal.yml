name: bootstrap universal Flow

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4

      - name: Fetch inherited upstream
        run: |
          git clone --depth=1 https://github.com/IyanuoluwaIlesanmi/FlowTribe-v2.git /tmp/upstream

      - name: Reconstruct governed universal patch
        run: |
          cat bootstrap/universal.patch.gz.b64.part* | base64 -d > /tmp/universal.patch.gz
          gzip -dc /tmp/universal.patch.gz > /tmp/universal.patch
          cd /tmp/upstream
          git apply --check /tmp/universal.patch
          git apply /tmp/universal.patch
          rm -rf .github/workflows

      - name: Import source while preserving this repository history
        run: |
          rsync -a --exclude='.git' /tmp/upstream/ ./
          rm -rf bootstrap
          git status --short
          git config user.name "Flow Tribe CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: import governed universal Flow v2.1"
          git push origin HEAD:main
