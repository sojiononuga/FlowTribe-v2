name: Implement Griot server voice

on:
  push:
    branches:
      - feature/griot-consistent-server-voice

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/griot-consistent-server-voice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python3 scripts/ops_apply_griot_voice.py
      - name: Verify
        run: npm ci && npm run verify
      - name: Commit implementation
        run: |
          git rm .github/workflows/implement-griot-server-voice.yml scripts/ops_apply_griot_voice.py
          git config user.name "flowtribe-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add appsscript/03_Router.gs appsscript/services/GriotService.gs src/features/showcase/member-assist.js tests/griot-source-contract.mjs docs/GRIOT_AI_DISCLOSURE.md
          git commit -m "Add consistent cross-device Griot voice"
          git push origin HEAD:feature/griot-consistent-server-voice
