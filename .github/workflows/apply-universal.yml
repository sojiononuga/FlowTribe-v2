name: apply universal Flow release

on:
  push:
    branches: [import/universal-flow]
    paths:
      - 'migration/**'
      - '.github/workflows/apply-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release patch
        run: |
          cat migration/universal.b64.part* | base64 -d > /tmp/universal.patch.gz
          gzip -t /tmp/universal.patch.gz
          gzip -dc /tmp/universal.patch.gz > /tmp/universal.patch
          git apply --check /tmp/universal.patch
          git apply /tmp/universal.patch

      - name: Verify JavaScript syntax
        run: |
          find src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Install browser verification tooling
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium

      - name: Run 112 backend checks and 18 real-screen journeys
        run: npm run verify

      - name: Commit verified universal Flow source
        run: |
          rm -rf migration
          rm -f .github/workflows/apply-universal.yml
          git config user.name 'Flow Tribe CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: universal Flow goals actions adaptation and momentum'
          git push origin HEAD:import/universal-flow
