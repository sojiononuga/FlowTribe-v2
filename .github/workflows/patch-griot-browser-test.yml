name: patch Griot browser test for Netlify route

on:
  push:
    paths:
      - '.github/workflows/patch-griot-browser-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/griot-consistent-server-voice
      - name: Patch Griot Netlify route mock
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/verify-browser.mjs')
          s = p.read_text()
          needle = "  await page.route('https://flow.test/griot', async (route) => {\n"
          insert = """  await page.route('**/.netlify/functions/griot', async (route) => {\n    const raw = route.request().postData() || '{}';\n    const body = JSON.parse(raw);\n    requests.push(body);\n\n    let data = {};\n    if (body.action === 'griot.chat') {\n      const spoken = /family emergency/i.test(body.payload?.message || '');\n      data = spoken\n        ? {\n            text: 'Do not try to repay the lost evening. Protect the submission goal and choose one complete, time-boxed move tomorrow morning before the day gets noisy.',\n            action: { route: '/adapt', label: 'Shape tomorrow’s move' },\n            grounded: true,\n          }\n        : {\n            text: 'The interruption changes the route, not the destination. Keep the competition submission as the anchor and choose one credible move you can finish tomorrow.',\n            action: { event: 'tour', label: 'Show me how Flow helps' },\n            grounded: true,\n          };\n    } else if (body.action === 'griot.speak') {\n      data = { audioBase64: 'SUQz', mimeType: 'audio/mpeg', voice: 'alloy', model: 'openai/gpt-4o-mini-tts-2025-12-15' };\n    }\n\n    await route.fulfill({\n      status: 200,\n      headers: { 'content-type': 'application/json; charset=utf-8' },\n      body: JSON.stringify({ ok: true, data, meta: {} }),\n    });\n  });\n\n"""
          if needle not in s:
              raise SystemExit('expected route anchor not found')
          s = s.replace(needle, insert + needle, 1)
          p.write_text(s)
      - name: Verify
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium
          cp src/core/config.example.js src/core/config.js
          npm run verify
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/verify-browser.mjs
          git commit -m 'test: mock Netlify Griot route in browser verification'
          git push origin HEAD:feature/griot-consistent-server-voice
