name: live production verify

on:
  push:
    paths:
      - '.github/workflows/live-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dainty-frangollo-1063b3.netlify.app
      API_URL: https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec
    steps:
      - uses: actions/checkout@v4

      - name: Verify live help-quality assets and API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/" -o /tmp/member.html
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/admin.html" -o /tmp/admin.html
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/showcase/meta-ai.js" -o /tmp/meta-ai.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/showcase/tour-quality.js" -o /tmp/tour-quality.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/styles/meta-ai.css" -o /tmp/meta-ai.css
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/styles/tour-quality.css" -o /tmp/tour-quality.css
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/core/config.js" -o /tmp/config.js

          grep -q '<title>Flow Tribe</title>' /tmp/member.html
          grep -q '<title>Flow Tribe · Admin</title>' /tmp/admin.html
          grep -qF 'styles/tour-quality.css' /tmp/member.html
          grep -qF 'styles/meta-ai.css' /tmp/member.html
          grep -qF 'Show me how it works' /tmp/meta-ai.js
          grep -qF 'not to push harder at the same plan' /tmp/meta-ai.js
          grep -qF 'flowtribe:tour-open' /tmp/meta-ai.js
          grep -qF 'installTourQualityGuards' /tmp/tour-quality.js
          grep -qF 'ft-profile-head' /tmp/tour-quality.js
          grep -qF 'ft-activity-calendar' /tmp/tour-quality.js
          grep -qF "$API_URL" /tmp/config.js

          HEALTH="$(curl -fsSL --retry 5 --retry-delay 2 "$API_URL")"
          printf '%s\n' "$HEALTH"
          printf '%s' "$HEALTH" | grep -q '2.0.0'

      - name: Install Chromium verification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Exercise live Meta and tour quality
        shell: bash
        run: |
          set -euo pipefail
          cat > live-help-check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const site = process.env.SITE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(error.message));

          await page.goto(`${site}/#/login`, { waitUntil: 'networkidle', timeout: 30000 });
          await page.getByText('Welcome back', { exact: true }).waitFor({ timeout: 15000 });

          await page.evaluate(async () => {
            document.querySelectorAll('.ft-assist').forEach((node) => node.remove());
            const { installTourQualityGuards } = await import('/src/features/showcase/tour-quality.js');
            const { MetaAiControl } = await import('/src/features/showcase/meta-ai.js');
            installTourQualityGuards();

            const fixture = document.createElement('div');
            fixture.id = 'live-help-fixture';
            document.body.append(fixture);

            const main = document.createElement('main');
            main.id = 'main';
            main.className = 'ft-live-tour-target';
            const profile = document.createElement('section');
            profile.className = 'ft-profile-head';
            profile.textContent = 'Profile feature';
            main.append(profile);

            const tour = document.createElement('div');
            tour.className = 'ft-live-tour';
            const panel = document.createElement('div');
            panel.className = 'ft-live-tour__panel';
            panel.textContent = 'Guide';
            tour.append(panel);

            const calendar = document.createElement('div');
            calendar.className = 'ft-calendar';
            fixture.append(main, tour, calendar);
            location.hash = '#/profile';

            const status = document.createElement('span');
            fixture.append(MetaAiControl({ status }));
          });

          await page.waitForTimeout(180);
          const targeting = await page.evaluate(() => ({
            main: document.querySelector('#main').classList.contains('ft-live-tour-target'),
            profile: document.querySelector('.ft-profile-head').classList.contains('ft-live-tour-target'),
            calendarAlias: document.querySelector('.ft-calendar').classList.contains('ft-activity-calendar'),
            placement: document.querySelector('.ft-live-tour__panel').dataset.placement || '',
          }));
          if (targeting.main) throw new Error('production tour still targets whole page');
          if (!targeting.profile) throw new Error('production tour did not retarget profile feature');
          if (!targeting.calendarAlias) throw new Error('production movement-calendar target alias missing');
          if (!['top', 'bottom'].includes(targeting.placement)) throw new Error(`production tour placement invalid: ${targeting.placement}`);

          await page.evaluate(() => { document.querySelector('.ft-live-tour').hidden = true; });
          await page.getByRole('button', { name: 'Ask Meta AI' }).click();
          await page.getByLabel('Ask Meta AI a question').fill('What if I am still struggling?');
          await page.getByLabel('Ask Meta AI a question').press('Enter');
          await page.getByText(/not to push harder at the same plan/i).waitFor({ timeout: 5000 });
          await page.getByText(/recovery move you can actually do/i).waitFor({ timeout: 5000 });

          const overflow = await page.evaluate(() => {
            const panel = document.querySelector('.ft-meta-ai__panel');
            const quick = document.querySelector('.ft-meta-ai__quick');
            const composer = document.querySelector('.ft-meta-ai__composer');
            return {
              panel: panel.scrollWidth - panel.clientWidth,
              quick: quick.scrollWidth - quick.clientWidth,
              composer: composer.scrollWidth - composer.clientWidth,
              inputTag: document.querySelector('.ft-meta-ai__input').tagName,
            };
          });
          if (overflow.panel > 1 || overflow.quick > 1 || overflow.composer > 1) {
            throw new Error(`production Meta horizontal overflow: ${JSON.stringify(overflow)}`);
          }
          if (overflow.inputTag !== 'TEXTAREA') throw new Error(`production Meta composer is ${overflow.inputTag}`);

          await page.getByLabel('Ask Meta AI a question').fill('How can this app help me?');
          await page.getByLabel('Ask Meta AI a question').press('Enter');
          const tourAction = page.getByRole('button', { name: 'Show me how it works' });
          await tourAction.waitFor({ timeout: 5000 });
          const eventReceived = page.evaluate(() => new Promise((resolve) => {
            document.addEventListener('flowtribe:tour-open', () => resolve(true), { once: true });
            setTimeout(() => resolve(false), 2000);
          }));
          await tourAction.click();
          if (!(await eventReceived)) throw new Error('production Meta → tour event did not fire');

          if (pageErrors.length) throw new Error(`production help page errors:\n${pageErrors.join('\n')}`);
          await browser.close();
          console.log('LIVE HELP QUALITY PASSED');
          EOF
          node live-help-check.mjs

# completed help-quality production verification trigger: 2026-08-28
