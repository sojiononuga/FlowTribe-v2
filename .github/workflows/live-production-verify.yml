name: live production verify

on:
  push:
    paths:
      - '.github/workflows/live-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dainty-frangollo-1063b3.netlify.app
      API_URL: https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec
    steps:
      - uses: actions/checkout@v4

      - name: Verify live Meta AI and autonomous tour assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/" -o /tmp/member.html
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/showcase/member-assist.js" -o /tmp/assist.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/showcase/meta-ai.js" -o /tmp/meta.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/styles/meta-ai.css" -o /tmp/meta.css
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/core/config.js" -o /tmp/config.js

          grep -qF 'styles/meta-ai.css' /tmp/member.html
          grep -qF 'Ask Meta AI' /tmp/meta.js
          grep -qF 'flowtribe.meta.help.v1' /tmp/meta.js
          grep -qF "intensity: 'active'" /tmp/meta.js
          grep -qF 'What do I need to do?' /tmp/meta.js
          grep -qF 'Flow does not currently store a separate dated task list' /tmp/meta.js
          grep -qF 'running late' /tmp/meta.js
          grep -qF '17 · VOICE AND GUIDED HELP' /tmp/assist.js
          grep -qF 'scheduleAdvance' /tmp/assist.js
          grep -qF "text: 'Pause'" /tmp/assist.js
          grep -qF 'max-height: calc(100dvh - 2rem)' /tmp/meta.css
          grep -qF "$API_URL" /tmp/config.js

          HEALTH="$(curl -fsSL --retry 5 --retry-delay 2 "$API_URL")"
          printf '%s' "$HEALTH" | grep -q '2.0.0'

      - name: Install Chromium verification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Exercise Meta AI, viewport fit and autonomous progression
        shell: bash
        run: |
          set -euo pipefail
          cat > live-check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const site = process.env.SITE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1180, height: 620 } });
          const errors = [];
          page.on('pageerror', (e) => errors.push(`pageerror: ${e.message}`));
          page.on('console', (m) => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

          await page.addInitScript(() => {
            class MockUtterance {
              constructor(text) {
                this.text = text;
                this.rate = 1;
                this.pitch = 1;
                this.volume = 1;
                this.voice = null;
              }
            }
            const voices = [{ name: 'Flow Test', lang: 'en-GB', voiceURI: 'flow-test', default: true }];
            window.__spoken = [];
            Object.defineProperty(window, 'SpeechSynthesisUtterance', { value: MockUtterance, configurable: true });
            Object.defineProperty(window, 'speechSynthesis', {
              configurable: true,
              value: {
                getVoices: () => voices,
                cancel: () => {},
                addEventListener: () => {},
                speak: (utterance) => {
                  window.__spoken.push(utterance.text);
                  utterance.onstart?.();
                  setTimeout(() => utterance.onend?.(), 30);
                },
              },
            });
          });

          await page.goto(`${site}/#/login`, { waitUntil: 'networkidle', timeout: 30000 });
          await page.getByText('Welcome back', { exact: true }).waitFor({ timeout: 15000 });

          await page.evaluate(async () => {
            document.querySelectorAll('.ft-assist').forEach((node) => node.remove());
            const { MemberAssistControls } = await import('/src/features/showcase/member-assist.js');
            document.body.append(MemberAssistControls());
          });

          // Meta AI is present and conversational even when a question does not need member data.
          await page.getByRole('button', { name: 'Ask Meta AI' }).click();
          await page.getByLabel('Ask Meta AI a question').fill('What date is it?');
          await page.getByRole('button', { name: 'Ask', exact: true }).click();
          await page.getByText(/^Today is /).waitFor({ timeout: 5000 });
          await page.getByRole('button', { name: 'Ask Meta AI' }).click();

          // Open the tour at the same short viewport class that exposed the clipping defect.
          await page.getByRole('button', { name: 'Show me round Flow Tribe' }).click();
          await page.getByText('Flow keeps meaningful goals alive when life changes.', { exact: true }).waitFor({ timeout: 5000 });

          const box = await page.locator('.ft-live-tour__panel').boundingBox();
          if (!box) throw new Error('tour panel has no bounding box');
          if (box.y < -0.5) throw new Error(`tour panel clipped above viewport: y=${box.y}`);
          if (box.y + box.height > 620.5) throw new Error(`tour panel clipped below viewport: bottom=${box.y + box.height}`);

          // No click on Next: narration ending must move the tour to stage 2 by itself.
          await page.getByText('Your Flow puts the important things in one place.', { exact: true }).waitFor({ timeout: 3500 });
          const spoken = await page.evaluate(() => window.__spoken);
          if (!spoken.some((text) => text.includes('Welcome to Flow Tribe'))) throw new Error('first tour stage was not narrated');
          if (!spoken.some((text) => text.includes('This is your home base'))) throw new Error('second tour stage did not start narrating automatically');

          await page.getByRole('button', { name: 'Close guided tour' }).click();

          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          console.log('LIVE META AI + VIEWPORT-SAFE AUTONOMOUS TOUR PASSED');
          EOF
          node live-check.mjs

# Meta AI + autonomous tour live verification trigger: 2026-08-28
