name: live production verify

on:
  push:
    paths:
      - '.github/workflows/live-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dainty-frangollo-1063b3.netlify.app
      API_URL: https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec
    steps:
      - uses: actions/checkout@v4

      - name: Verify live HTTP surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/" -o /tmp/member.html
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/admin.html" -o /tmp/admin.html
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/styles/modern-ui.css" -o /tmp/modern-ui.css
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/showcase/showcase.js" -o /tmp/showcase.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/demo/demo-view.js" -o /tmp/demo.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/core/config.js" -o /tmp/config.js

          grep -q '<title>Flow Tribe</title>' /tmp/member.html
          grep -q '<title>Flow Tribe · Admin</title>' /tmp/admin.html
          grep -q 'styles/modern-ui.css' /tmp/member.html
          grep -qF -- '--ft-showcase-cream: #f6f4ef' /tmp/modern-ui.css
          grep -qF '.ft-logo__the' /tmp/modern-ui.css
          grep -qF '.ft-showcase' /tmp/modern-ui.css
          grep -q "label: 'Voice'" /tmp/showcase.js
          grep -q "label: 'META AI'" /tmp/showcase.js
          grep -q "label: 'Demo'" /tmp/showcase.js
          grep -q "label: 'Show me round'" /tmp/showcase.js
          grep -qF 'https://www.meta.ai/' /tmp/showcase.js
          grep -qF "href: '#/demo'" /tmp/showcase.js
          grep -qF 'Watch Flow change the path, not the goal.' /tmp/demo.js
          grep -qF "$API_URL" /tmp/config.js

          HEALTH="$(curl -fsSL --retry 5 --retry-delay 2 "$API_URL")"
          printf '%s\n' "$HEALTH"
          printf '%s' "$HEALTH" | grep -q '2.0.0'

          USERNAME="livecheck$(date +%s)"
          BODY="$(jq -nc --arg u "$USERNAME" '{action:"auth.checkUsername",payload:{username:$u},requestId:("live-"+$u),clientVersion:"2.0.0"}')"
          RESPONSE="$(curl -fsSL --retry 5 --retry-delay 2 -H 'Content-Type: text/plain;charset=utf-8' --data "$BODY" "$API_URL")"
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | jq -e '.ok == true and (.data.available | type == "boolean")' >/dev/null

          LOGIN_BODY="$(jq -nc --arg u "$USERNAME" '{action:"auth.login",payload:{username:$u,pin:"539182"},requestId:("live-login-"+$u),clientVersion:"2.0.0"}')"
          LOGIN_RESPONSE="$(curl -fsSL --retry 5 --retry-delay 2 -H 'Content-Type: text/plain;charset=utf-8' --data "$LOGIN_BODY" "$API_URL")"
          printf '%s\n' "$LOGIN_RESPONSE"
          printf '%s' "$LOGIN_RESPONSE" | jq -e '.ok == false and .error.code == "AUTH_FAILED"' >/dev/null

      - name: Install Chromium verification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify real showcase, demo and admin screens
        shell: bash
        run: |
          set -euo pipefail
          cat > live-check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const site = process.env.SITE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', (e) => errors.push(`pageerror: ${e.message}`));
          page.on('console', (m) => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

          await page.goto(`${site}/#/login`, { waitUntil: 'networkidle', timeout: 30000 });
          await page.getByText('Welcome back', { exact: true }).waitFor({ timeout: 15000 });
          await page.getByRole('button', { name: 'Log in' }).waitFor({ timeout: 15000 });
          if ((await page.title()) !== 'Log in · Flow Tribe') throw new Error(`member title: ${await page.title()}`);

          const voice = page.getByText('Voice', { exact: true });
          const meta = page.getByText('META AI', { exact: true });
          const demo = page.getByText('Demo', { exact: true });
          const tour = page.getByText('Show me round', { exact: true });
          await voice.waitFor({ timeout: 15000 });
          await meta.waitFor({ timeout: 15000 });
          await demo.waitFor({ timeout: 15000 });
          await tour.waitFor({ timeout: 15000 });

          const metaLink = page.locator('a.ft-showcase-action').filter({ hasText: 'META AI' });
          if ((await metaLink.getAttribute('href')) !== 'https://www.meta.ai/') throw new Error('META AI hand-off href is wrong');
          const demoLink = page.locator('a.ft-showcase-action').filter({ hasText: 'Demo' });
          if ((await demoLink.getAttribute('href')) !== '#/demo') throw new Error('Demo href is wrong');

          await page.getByRole('button', { name: /Show me round/ }).click();
          await page.getByRole('dialog').waitFor({ timeout: 10000 });
          await page.getByText('Start with a goal that matters.', { exact: true }).waitFor();
          await page.getByRole('button', { name: 'Next' }).click();
          await page.getByText('Turn intention into one useful action.', { exact: true }).waitFor();
          await page.getByRole('button', { name: 'Close guided tour' }).last().click();

          await page.goto(`${site}/#/demo`, { waitUntil: 'networkidle', timeout: 30000 });
          await page.getByText('Watch Flow change the path, not the goal.', { exact: true }).waitFor({ timeout: 15000 });
          await page.getByRole('button', { name: /Let Flow adapt my path/ }).waitFor({ timeout: 15000 });

          await page.goto(`${site}/admin.html`, { waitUntil: 'networkidle', timeout: 30000 });
          await page.getByText('Welcome back', { exact: true }).waitFor({ timeout: 15000 });
          const redirected = new URL(page.url());
          if (redirected.hash !== '#/login') throw new Error(`unauthenticated admin did not redirect to login: ${page.url()}`);
          if ((await page.title()) !== 'Log in · Flow Tribe') throw new Error(`redirected title: ${await page.title()}`);

          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          console.log('LIVE SHOWCASE + DEMO + ADMIN GUARD PASSED');
          EOF
          node live-check.mjs

# showcase completion production verification trigger: 2026-08-28
