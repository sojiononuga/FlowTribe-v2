name: live production verify

on:
  push:
    paths:
      - '.github/workflows/live-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dainty-frangollo-1063b3.netlify.app
    steps:
      - uses: actions/checkout@v4

      - name: Verify live viewport-fix asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/styles/tour-quality.css" -o /tmp/tour-quality.css
          grep -qF '.ft-live-tour-open .ft-topbar' /tmp/tour-quality.css
          grep -qF 'backdrop-filter: none !important' /tmp/tour-quality.css
          grep -qF 'max-height: calc(100dvh - 2rem)' /tmp/tour-quality.css

      - name: Install Chromium verification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prove tour card stays inside the visual viewport
        shell: bash
        run: |
          set -euo pipefail
          cat > live-tour-viewport.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const site = process.env.SITE_URL;
          const viewports = [
            { width: 2048, height: 1104, name: 'recording-class desktop' },
            { width: 1180, height: 620, name: 'short desktop' },
            { width: 390, height: 844, name: 'mobile' },
          ];

          for (const viewport of viewports) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${site}/#/login`, { waitUntil: 'networkidle', timeout: 30000 });

            await page.evaluate(() => {
              const topbar = document.createElement('header');
              topbar.id = 'viewport-test-topbar';
              topbar.className = 'ft-topbar';
              topbar.style.position = 'fixed';
              topbar.style.inset = '0 0 auto 0';

              const assist = document.createElement('div');
              assist.className = 'ft-assist';
              const tour = document.createElement('div');
              tour.className = 'ft-live-tour';
              const panel = document.createElement('section');
              panel.id = 'viewport-test-panel';
              panel.className = 'ft-live-tour__panel';
              panel.dataset.placement = 'top';
              panel.innerHTML = `
                <div class="ft-live-tour__top"><div class="ft-live-tour__meta"><span class="ft-live-tour__counter">9 of 17</span><span class="ft-live-tour__narration">Auto tour · speaking…</span></div></div>
                <p class="ft-live-tour__eyebrow">9 · MOVEMENT HISTORY</p>
                <h2 class="ft-live-tour__title">Returning becomes visible.</h2>
                <p class="ft-live-tour__body">The movement calendar shows evidence of return over time. It is designed to make continuity and recovery visible, not just uninterrupted streaks.</p>
                <div class="ft-live-tour__footer"><button class="ft-live-tour__button">Back</button><button class="ft-live-tour__button">Pause</button><button class="ft-live-tour__button">Replay voice</button><button class="ft-live-tour__button ft-live-tour__button--primary">Next now</button></div>`;
              tour.append(panel);
              assist.append(tour);
              topbar.append(assist);
              document.body.append(topbar);
              document.documentElement.classList.add('ft-live-tour-open');
            });

            const panel = page.locator('#viewport-test-panel');
            for (const placement of ['top', 'bottom']) {
              await panel.evaluate((node, value) => { node.dataset.placement = value; }, placement);
              await page.waitForTimeout(80);
              const metrics = await panel.evaluate((node) => {
                const rect = node.getBoundingClientRect();
                const topbar = document.querySelector('#viewport-test-topbar');
                const style = getComputedStyle(topbar);
                return {
                  top: rect.top,
                  bottom: rect.bottom,
                  height: rect.height,
                  innerHeight: window.innerHeight,
                  backdropFilter: style.backdropFilter || style.webkitBackdropFilter || 'none',
                };
              });

              if (metrics.top < -0.5) throw new Error(`${viewport.name}/${placement}: tour begins above viewport at ${metrics.top}`);
              if (metrics.bottom > metrics.innerHeight + 0.5) throw new Error(`${viewport.name}/${placement}: tour ends below viewport at ${metrics.bottom}/${metrics.innerHeight}`);
              if (metrics.backdropFilter !== 'none') throw new Error(`${viewport.name}/${placement}: topbar still creates fixed containing block: ${metrics.backdropFilter}`);
            }

            await page.close();
          }

          await browser.close();
          console.log('LIVE GUIDED TOUR VIEWPORT CONTAINMENT PASSED');
          EOF
          node live-tour-viewport.mjs

# guided-tour viewport containment verification trigger: 2026-08-28
# scoped fixture rerun: 2026-08-28
