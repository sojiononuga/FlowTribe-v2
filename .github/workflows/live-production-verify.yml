name: live production verify

on:
  push:
    paths:
      - '.github/workflows/live-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dainty-frangollo-1063b3.netlify.app
      API_URL: https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec
    steps:
      - uses: actions/checkout@v4

      - name: Verify live dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/" -o /tmp/member.html
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/styles/dashboard-contrast.css" -o /tmp/contrast.css
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/showcase/member-assist.js" -o /tmp/assist.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/main.js" -o /tmp/main.js
          grep -q 'styles/dashboard-contrast.css' /tmp/member.html
          grep -qF 'color: #f6f4ef' /tmp/contrast.css
          grep -qF '.ft-dashboard .ft-welcome__title' /tmp/contrast.css
          grep -qF '.ft-dashboard .ft-card--brand .ft-flow-hero__title' /tmp/contrast.css
          grep -qF "text: 'Voice'" /tmp/assist.js
          grep -qF "text: 'Show me round'" /tmp/assist.js
          grep -qF 'MemberAssistControls' /tmp/main.js

          HEALTH="$(curl -fsSL --retry 5 --retry-delay 2 "$API_URL")"
          printf '%s\n' "$HEALTH"
          printf '%s' "$HEALTH" | grep -q '2.0.0'

      - name: Install Chromium verification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify signed-in chrome exposes Voice and tour
        shell: bash
        run: |
          set -euo pipefail
          cat > live-check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const site = process.env.SITE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });

          await page.goto(`${site}/#/login`, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.evaluate(() => {
            localStorage.setItem('flowtribe.session.v1', JSON.stringify({
              token: 'live-ui-verification-token',
              expiresAt: null,
              member: { memberId: 'verify', username: 'verify', fullName: 'Verification User', platform: '', weeklyGoal: 3, role: 'Member' },
              capabilities: [],
              mustChangePin: false,
            }));
          });

          await page.goto(`${site}/#/dashboard`, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.getByRole('button', { name: 'Hear Flow voice' }).waitFor({ timeout: 15000 });
          await page.getByRole('button', { name: 'Show me round Flow Tribe' }).waitFor({ timeout: 15000 });
          await page.getByRole('button', { name: 'Show me round Flow Tribe' }).click();
          await page.getByRole('dialog').waitFor({ timeout: 10000 });
          await page.getByText('Start with a goal that matters.', { exact: true }).waitFor({ timeout: 10000 });

          const welcomeColour = await page.evaluate(() => {
            const css = [...document.styleSheets].find((sheet) => String(sheet.href || '').includes('dashboard-contrast.css'));
            return Boolean(css);
          });
          if (!welcomeColour) throw new Error('dashboard contrast stylesheet not loaded');

          await browser.close();
          console.log('LIVE SIGNED-IN VOICE + TOUR + CONTRAST ASSETS PASSED');
          EOF
          node live-check.mjs

# dashboard assist production verification trigger: 2026-08-28
