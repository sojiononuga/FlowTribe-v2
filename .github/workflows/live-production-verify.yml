name: live production verify

on:
  push:
    paths:
      - '.github/workflows/live-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dainty-frangollo-1063b3.netlify.app
      API_URL: https://script.google.com/macros/s/AKfycbwWWVFp0K9oJKkZsnOackCSCmeAUPxZLRANX9v1YN0Dl-Y3VdTg_4Qp5_s-arhYZuOB/exec
    steps:
      - uses: actions/checkout@v4

      - name: Verify live voice and tour assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/src/features/showcase/member-assist.js" -o /tmp/assist.js
          curl -fsSL --retry 5 --retry-delay 2 "$SITE_URL/styles/dashboard-contrast.css" -o /tmp/assist.css
          grep -qF "flowtribe.voice.v1" /tmp/assist.js
          grep -qF "Choose voice" /tmp/assist.js
          grep -qF "settings.rate" /tmp/assist.js
          grep -qF "settings.pitch" /tmp/assist.js
          grep -qF "Speak the guided tour" /tmp/assist.js
          grep -qF "route: '/submit'" /tmp/assist.js
          grep -qF "route: '/adapt'" /tmp/assist.js
          grep -qF "route: '/leaderboard'" /tmp/assist.js
          grep -qF "route: '/milestones'" /tmp/assist.js
          grep -qF "route: '/profile'" /tmp/assist.js
          grep -qF "scrollIntoView" /tmp/assist.js
          grep -qF "ft-live-tour-target" /tmp/assist.js
          grep -qF ".ft-voice-panel" /tmp/assist.css
          grep -qF ".ft-live-tour-target" /tmp/assist.css

          HEALTH="$(curl -fsSL --retry 5 --retry-delay 2 "$API_URL")"
          printf '%s' "$HEALTH" | grep -q '2.0.0'

      - name: Install Chromium verification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise voice settings and spoken tour component
        shell: bash
        run: |
          set -euo pipefail
          cat > live-check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const site = process.env.SITE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1180, height: 820 } });

          await page.addInitScript(() => {
            class MockUtterance {
              constructor(text) { this.text = text; this.rate = 1; this.pitch = 1; this.volume = 1; this.voice = null; }
            }
            const voices = [
              { name: 'Flow Warm', lang: 'en-GB', voiceURI: 'flow-warm', default: true },
              { name: 'Flow Calm', lang: 'en-GB', voiceURI: 'flow-calm', default: false },
            ];
            window.__spoken = [];
            Object.defineProperty(window, 'SpeechSynthesisUtterance', { value: MockUtterance, configurable: true });
            Object.defineProperty(window, 'speechSynthesis', {
              configurable: true,
              value: {
                getVoices: () => voices,
                cancel: () => {},
                addEventListener: () => {},
                speak: (utterance) => {
                  window.__spoken.push({
                    text: utterance.text,
                    rate: utterance.rate,
                    pitch: utterance.pitch,
                    voiceURI: utterance.voice?.voiceURI || '',
                  });
                  utterance.onstart?.();
                  setTimeout(() => utterance.onend?.(), 10);
                },
              },
            });
          });

          await page.goto(`${site}/#/login`, { waitUntil: 'networkidle', timeout: 30000 });
          await page.evaluate(async () => {
            const { MemberAssistControls } = await import('/src/features/showcase/member-assist.js');
            document.body.append(MemberAssistControls());
          });

          await page.getByRole('button', { name: 'Voice settings' }).last().click();
          await page.getByText('Choose how Flow speaks to you.', { exact: true }).waitFor();
          const select = page.getByLabel('Choose voice').last();
          if ((await select.locator('option').count()) < 3) throw new Error('voice choices were not populated');
          await select.selectOption('flow-calm');
          await page.getByLabel('Voice speed').last().fill('1.1');
          await page.getByLabel('Voice pitch').last().fill('0.9');
          await page.getByRole('button', { name: 'Preview this voice' }).last().click();
          await page.waitForTimeout(30);

          const preview = await page.evaluate(() => window.__spoken.at(-1));
          if (!preview || preview.voiceURI !== 'flow-calm') throw new Error('selected voice was not used');
          if (Math.abs(preview.rate - 1.1) > 0.01) throw new Error(`voice rate not applied: ${preview.rate}`);
          if (Math.abs(preview.pitch - 0.9) > 0.01) throw new Error(`voice pitch not applied: ${preview.pitch}`);

          await page.getByRole('button', { name: 'Show me round Flow Tribe' }).last().click();
          await page.getByText('This is your home base.', { exact: true }).waitFor({ timeout: 10000 });
          await page.waitForTimeout(500);
          const narrated = await page.evaluate(() => window.__spoken.some((item) => item.text.includes('Welcome to Flow Tribe')));
          if (!narrated) throw new Error('tour did not narrate its first step');
          await page.getByRole('button', { name: 'Next' }).last().click();
          await page.getByText('The goal stays visible.', { exact: true }).waitFor();
          await page.getByRole('button', { name: 'Replay voice' }).last().click();
          await page.waitForTimeout(30);
          const replayed = await page.evaluate(() => window.__spoken.at(-1)?.text.includes('green card'));
          if (!replayed) throw new Error('tour replay did not speak the current feature');

          await browser.close();
          console.log('LIVE CONFIGURABLE VOICE + SPOKEN ACTIVE TOUR PASSED');
          EOF
          node live-check.mjs

# configurable voice + active narrated tour verification trigger: 2026-08-28
