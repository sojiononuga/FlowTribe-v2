name: package Apps Script production handoff

on:
  push:
    paths:
      - '.github/workflows/package-apps-script.yml'
      - 'appsscript/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build single-file Apps Script handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/apps-script
          : > dist/apps-script/Code.gs
          files=(
            appsscript/00_Config.gs
            appsscript/01_Errors.gs
            appsscript/02_Envelope.gs
            appsscript/03_Router.gs
            appsscript/lib/FtWeek.js
            appsscript/lib/FtDayMap.js
            appsscript/lib/FtStreak.js
            appsscript/lib/FtLink.js
            appsscript/lib/FtIdentity.js
            appsscript/lib/FtAchievements.js
            appsscript/infra/Infra.gs
            appsscript/repositories/Repositories.gs
            appsscript/services/CoreServices.gs
            appsscript/services/DomainServices.gs
            appsscript/middleware/Middleware.gs
            appsscript/orchestrators/Orchestrators.gs
            appsscript/controllers/Controllers.gs
            appsscript/jobs/Jobs.gs
            appsscript/setup/Setup.gs
            appsscript/setup/OperatorRecovery.gs
            appsscript/setup/SmokeTest.gs
          )
          for f in "${files[@]}"; do
            printf '\n/* ===== BEGIN %s ===== */\n' "$f" >> dist/apps-script/Code.gs
            cat "$f" >> dist/apps-script/Code.gs
            printf '\n/* ===== END %s ===== */\n' "$f" >> dist/apps-script/Code.gs
          done
          cp appsscript/appsscript.json dist/apps-script/appsscript.json
          printf '%s\n' 'Source commit:' "$(git rev-parse HEAD)" 'Generated by package-apps-script.yml' > dist/apps-script/README.txt
      - name: Commit handoff bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/apps-script
          git commit -m 'build: package Apps Script production handoff' || exit 0
          git push origin HEAD:main
