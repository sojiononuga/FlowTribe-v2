<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Flow Tribe</title>
    <meta name="description" content="Stay consistent. Post, log it, keep your streak." />
    <meta name="theme-color" content="#5B0000" />

    <!--
      Member app shell.

      All ten member screens are built and load as route modules fetched on
      first visit, so a member downloads only the screens they actually open.

      Stylesheets are separate <link> tags rather than one file with @import
      because @import chains are fetched serially — each one costs a round trip
      before the next begins. Separate links are fetched in parallel, which
      matters on the mobile connections most members will use. There is no
      bundler by design, so this is how the layering stays free.
    -->
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/animations.css" />
    <link rel="stylesheet" href="styles/utilities.css" />
    <link rel="stylesheet" href="styles/components-ui.css" />
    <link rel="stylesheet" href="styles/components-brand.css" />
    <link rel="stylesheet" href="styles/components-layout.css" />
    <link rel="stylesheet" href="styles/components-calendar.css" />
    <link rel="stylesheet" href="styles/components-views.css" />

    <!-- Inline SVG favicon: no request, and it scales. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235B0000'/%3E%3Ctext x='30' y='45' font-family='system-ui,sans-serif' font-size='38' font-weight='800' fill='%23ffffff' text-anchor='middle'%3EF%3C/text%3E%3Ccircle cx='47' cy='21' r='6' fill='%23F5B400'/%3E%3C/svg%3E"
    />
  </head>

  <body>
    <div id="app"></div>

    <!--
      type="module" gives us ES modules with no bundler: real imports, deferred
      execution, and strict mode by default.

      Note for local development: modules are subject to CORS, so opening this
      file directly with file:// will not work. Serve the folder over HTTP —
      see scripts/README.md.
    -->
    <script type="module" src="src/main.js"></script>

    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        <h1>Flow Tribe needs JavaScript</h1>
        <p>Please enable JavaScript in your browser to log posts and check your streak.</p>
      </div>
    </noscript>
  </body>
</html>
